# 12_PARSEC STUDIO — Netlify config
#
# Custom domain is configured in the Netlify dashboard (Domain management),
# NOT in this file. Point the domain's CNAME at the Netlify site, then add it
# as a custom domain in the dashboard.
#   Custom domain: io12parsec.com

[build]
  command = "npm run build"
  publish = "dist"

# SPA fallback — React Router owns the routes.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
